name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The sync engine comes from the private connector-foundations library on GitHub Packages.
# PACKAGES_TOKEN is a repository secret: a token with read:packages.
env:
  PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

jobs:
  test:
    name: Build and test (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run all tests
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  smoke:
    name: Docker Compose smoke test, then publish images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: ./scripts/build-images.sh

      - name: Start dependencies
        run: docker compose up -d postgres acme-crm-mock

      - name: Run one sync against the misbehaving mock
        run: docker compose run --rm -e SYNC_INTERVAL_SECONDS=0 reliable-sync sync

      - name: Show support report
        run: docker compose run --rm -e SYNC_INTERVAL_SECONDS=0 reliable-sync report

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Publish images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in acme-crm-mock reliable-sync; do
            docker tag "ghcr.io/abdullah204/$image:latest" "ghcr.io/abdullah204/$image:sha-${GITHUB_SHA::7}"
            docker push "ghcr.io/abdullah204/$image:latest"
            docker push "ghcr.io/abdullah204/$image:sha-${GITHUB_SHA::7}"
          done
